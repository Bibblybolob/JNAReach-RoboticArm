# Planning scene obstacles for myCobot 280 Pi.
#
# The robot is mounted base-down at the world origin (0,0,0) and faces up
# (+Z). The myCobot 280 Pi has ~280mm (0.28m) reach.
#
# ALL OBSTACLES REMOVED. The previous table/shelf/wall definitions were
# disabled because their positions did not match their own comments (the
# "25cm behind the robot" shelf sat at y=-0.04, i.e. 4cm, which intersects
# the robot's own base and makes MoveIt refuse to plan anything).
#
# The scene is intentionally empty: self-collision checking still applies via
# the SRDF, but NOTHING in the physical environment is modelled. The planner
# will happily drive the arm through the button panel, its mount, cabling, or
# anything else actually present. Add real, measured geometry before running
# near hardware you care about.
#
# To add one back, append an entry under `obstacles:` in this form and restart
# the MoveIt2 launch to reload:
#
#   obstacles:
#     - name: button_panel
#       type: box
#       dimensions: [0.20, 0.02, 0.30]   # [x, y, z] size in metres
#       position: [0.0, 0.25, 0.10]      # centre, in the world frame
#       orientation: [0.0, 0.0, 0.0]     # [roll, pitch, yaw] in radians
#
# scene_objects.py handles an empty list gracefully — it logs
# "No obstacles to publish" and does nothing.

frame_id: world

obstacles: []
